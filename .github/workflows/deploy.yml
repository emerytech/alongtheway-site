name: Build and publish Zeus website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zeus-website
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:site
      - name: Identify the checked source revision
        run: node -e 'require("node:fs").writeFileSync("dist/deployment.json", JSON.stringify({revision:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID})+"\n")'
      - name: Publish static output only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          parents=()
          if git ls-remote --exit-code origin refs/heads/site-dist >/dev/null 2>&1; then
            git fetch --depth=1 origin site-dist
            parents=(-p FETCH_HEAD)
          fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/website-index"
          git --work-tree="$PWD/dist" add --all
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" "${parents[@]}" -m "Deploy website from $GITHUB_SHA")
          git push origin "$commit:refs/heads/site-dist"
